[package]
name = "sjk-pipeline-cache"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "A wgpu pipeline cache made from bytes saved by an earlier run, behind a safe API"

[dependencies]
wgpu = { version = "30.0.1", default-features = false, features = ["std"] }

# The third crate allowed `unsafe` (after sjk-mediafoundation and sjk-gpu-memory): wgpu's
# `create_pipeline_cache` is an unsafe function. Its one block says why it is sound
# (undocumented_unsafe_blocks); the rest of the workspace keeps `unsafe_code = "forbid"`.
[lints.rust]
unsafe_code = "allow"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
